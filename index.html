<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Турбо Гонка</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: Arial, sans-serif; }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        #score-board { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
        #score { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        #high-score { font-size: 16px; color: #ffd700; }
        
        #speedometer { position: absolute; bottom: 30px; right: 20px; color: white; text-align: right; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
        #speed-val { font-size: 42px; font-weight: bold; line-height: 1; }
        #speed-unit { font-size: 16px; color: #ddd; }
        
        button { cursor: pointer; font-family: inherit; font-weight: bold; border: none; pointer-events: auto; touch-action: manipulation; }
        
        #restart-btn { position: absolute; top: 20px; right: 20px; padding: 12px 24px; font-size: 16px; background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border-radius: 12px; display: none; }

        #steering-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 130px; height: 130px; pointer-events: auto; display: flex; justify-content: center; align-items: center; touch-action: none; z-index: 20; }
        #steering-wheel { width: 100%; height: 100%; border-radius: 50%; border: 10px solid #2f3542; box-sizing: border-box; position: relative; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(2px); }
        #steering-wheel::before, #steering-wheel::after { content: ''; position: absolute; background: #2f3542; border-radius: 5px; }
        #steering-wheel::before { top: 0; left: 50%; width: 8px; height: 100%; transform: translateX(-50%); }
        #steering-wheel::after { top: 50%; left: 0; width: 100%; height: 8px; transform: translateY(-50%); }
        #steering-center { position: absolute; width: 40px; height: 40px; background: #57606f; border-radius: 50%; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid #2f3542; }

        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 36px; font-weight: 900; text-shadow: 0 0 20px #ff4757; display: none; text-align: center; background: rgba(0,0,0,0.85); padding: 30px 50px; border-radius: 20px; border: 2px solid #ff4757; z-index: 50; }
        #restart-game-btn { margin-top: 15px; padding: 15px 40px; font-size: 22px; background: linear-gradient(135deg, #2ed573, #1e90ff); color: white; border-radius: 50px; text-transform: uppercase; }
        
        /* Экран загрузки */
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-weight: bold; z-index: 100; text-align: center; }
    </style>
</head>
<body>

    <div id="loading">Загрузка 3D...</div>

    <!-- Подключаем стабильную версию Three.js с другого сервера -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

    <div id="ui-layer">
        <div id="score-board">
            <div id="score">Счёт: 0</div>
            <div id="high-score">Рекорд: 0</div>
        </div>
        
        <div id="speedometer">
            <div id="speed-val">0</div>
            <div id="speed-unit">КМ/Ч</div>
        </div>

        <button id="restart-btn" onclick="resetGame()">ЗАНОВО</button>
        
        <div id="steering-container">
            <div id="steering-wheel">
                <div id="steering-center"></div>
            </div>
        </div>

        <div id="game-over">
            💥 БУМ! 💥
            <p>Ты попал в аварию</p>
            <button id="restart-game-btn" onclick="resetGame()">ЗАНОВО</button>
        </div>
    </div>

    <script>
        const lerp = (a, b, t) => a + (b - a) * t;
        let gameState = 'loading'; 
        
        let scene, camera, renderer, car, wheels = [], frontWheels = [];
        let traffic = [], lines = [], envObjects = [];
        let particles, particleVelocities = [], posArray, particleCount = 100;
        
        let speed = 0, maxSpeed = 55, acceleration = 12, score = 0, highScore = 0;
        let targetSteer = 0, currentSteer = 0, isDragging = false;
        
        const wheelEl = document.getElementById('steering-wheel');
        const steeringContainer = document.getElementById('steering-container');
        const roadWidth = 12, roadLength = 300;
        
        let bodyMat, road, grassLeft, grassRight;

        try { highScore = localStorage.getItem('turboRaceHighScore') || 0; } catch(e) {}
        document.getElementById('high-score').innerText = "Рекорд: " + Math.floor(highScore);

        // --- АУДИО ---
        let audioCtx, engineOsc1, engineOsc2, engineGain, engineFilter;
        let audioStarted = false;

        function initAudio() {
            if (audioStarted) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                startEngine();
                audioStarted = true;
            } catch(e) {}
        }

        window.addEventListener('touchstart', initAudio, {once: true});
        window.addEventListener('mousedown', initAudio, {once: true});

        function startEngine() {
            if (!audioCtx) return;
            try {
                engineOsc1 = audioCtx.createOscillator(); engineOsc2 = audioCtx.createOscillator(); engineGain = audioCtx.createGain(); engineFilter = audioCtx.createBiquadFilter();
                engineOsc1.type = 'sawtooth'; engineOsc2.type = 'square';
                engineOsc1.frequency.value = 40; engineOsc2.frequency.value = 40;
                engineFilter.type = 'lowpass'; engineFilter.frequency.value = 300; engineGain.gain.value = 0.04;
                engineOsc1.connect(engineFilter); engineOsc2.connect(engineFilter);
                engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
                engineOsc1.start(); engineOsc2.start();
            } catch(e){}
        }
        function updateEngineSound(speed) {
            if (!engineOsc1 || !audioCtx) return;
            try {
                const freq = 40 + (speed * 3); 
                engineOsc1.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
                engineOsc2.frequency.setTargetAtTime(freq * 0.5, audioCtx.currentTime, 0.1);
                engineFilter.frequency.setTargetAtTime(freq * 4, audioCtx.currentTime, 0.1);
            } catch(e){}
        }
        function stopEngine() {
            if (!engineOsc1 || !audioCtx) return;
            try {
                engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                setTimeout(() => { try { engineOsc1.stop(); engineOsc2.stop(); } catch(e) {} }, 200);
            } catch(e){}
        }
        function playCrash() {
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }

        // --- 3D ИНИЦИАЛИЗАЦИЯ ---
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6); scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            dirLight.position.set(20, 30, 10); dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.left = -30; dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30; dirLight.shadow.camera.bottom = -30;
            dirLight.shadow.camera.far = 100; scene.add(dirLight);

            road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, roadLength), new THREE.MeshStandardMaterial({ color: 0x2f3542, roughness: 0.9 }));
            road.rotation.x = -Math.PI / 2; road.receiveShadow = true; scene.add(road);

            const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            for (let i = -roadLength / 2; i < roadLength / 2; i += 6) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 3), lineMat);
                line.rotation.x = -Math.PI / 2; line.position.set(0, 0.02, i); line.receiveShadow = true;
                scene.add(line); lines.push(line);
            }

            const grassMat = new THREE.MeshStandardMaterial({ color: 0x2E8B57 });
            grassLeft = new THREE.Mesh(new THREE.PlaneGeometry(200, roadLength), grassMat);
            grassLeft.rotation.x = -Math.PI / 2; grassLeft.position.set(-roadWidth/2 - 100, -0.1, 0); grassLeft.receiveShadow = true; scene.add(grassLeft);
            grassRight = new THREE.Mesh(new THREE.PlaneGeometry(200, roadLength), grassMat);
            grassRight.rotation.x = -Math.PI / 2; grassRight.position.set(roadWidth/2 + 100, -0.1, 0); grassRight.receiveShadow = true; scene.add(grassRight);

            function createPineTree() {
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2.5), new THREE.MeshStandardMaterial({color: 0x5c4033}));
                trunk.position.y = 1.25; trunk.castShadow = true;
                const leavesMat = new THREE.MeshStandardMaterial({color: 0x1e5631});
                for(let i=0; i<3; i++) {
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(2 - i*0.5, 2.5, 7), leavesMat);
                    leaves.position.y = 2 + i*1.5; leaves.castShadow = true; group.add(leaves);
                }
                group.add(trunk); return group;
            }
            function createHouse() {
                const group = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), new THREE.MeshStandardMaterial({color: 0xf5f6fa}));
                base.position.y = 2; base.castShadow = true; base.receiveShadow = true;
                const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 3, 4), new THREE.MeshStandardMaterial({color: 0xe84118}));
                roof.position.y = 5.5; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
                group.add(base, roof); return group;
            }
            for (let i = -100; i < 200; i += 25) {
                let objL = Math.random() > 0.6 ? createHouse() : createPineTree();
                objL.position.set(-roadWidth/2 - 4 - Math.random() * 10, 0, -i); scene.add(objL); envObjects.push(objL);
                let objR = Math.random() > 0.6 ? createHouse() : createPineTree();
                objR.position.set(roadWidth/2 + 4 + Math.random() * 10, 0, -i); scene.add(objR); envObjects.push(objR);
            }

            car = new THREE.Group();
            bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.7, roughness: 0.2 }); 
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            
            const chassis = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 4.5), bodyMat); chassis.position.y = 0.5; chassis.castShadow = true; car.add(chassis);
            const hood = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 1.5), bodyMat); hood.position.set(0, 0.8, -1.2); hood.castShadow = true; car.add(hood);
            const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 0.1), darkMat); windshield.position.set(0, 1.1, -0.3); windshield.rotation.x = -0.5; car.add(windshield);
            const roof = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 1.5), bodyMat); roof.position.set(0, 1.4, 0.6); car.add(roof);
            const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 0.1), darkMat); rearGlass.position.set(0, 1.1, 1.4); rearGlass.rotation.x = 0.5; car.add(rearGlass);
            const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.1, 0.5), darkMat); spoiler.position.set(0, 1.3, 2.1); car.add(spoiler);

            const headMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const headL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headMat); headL.position.set(-0.7, 0.7, -2.26); car.add(headL);
            const headR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headMat); headR.position.set(0.7, 0.7, -2.26); car.add(headR);
            const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.1), tailMat); tailL.position.set(-0.6, 0.7, 2.26); car.add(tailL);
            const tailR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.1), tailMat); tailR.position.set(0.6, 0.7, 2.26); car.add(tailR);

            const tireGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.35, 20);
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.36, 8);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 });
            
            const wheelPositions = [{ x: -1, y: 0.4, z: -1.4, isFront: true }, { x: 1, y: 0.4, z: -1.4, isFront: true }, { x: -1, y: 0.4, z: 1.4, isFront: false }, { x: 1, y: 0.4, z: 1.4, isFront: false }];
            wheelPositions.forEach(pos => {
                const pivot = new THREE.Group(); pivot.position.set(pos.x, pos.y, pos.z);
                const tire = new THREE.Mesh(tireGeo, tireMat); tire.rotation.z = Math.PI / 2; tire.castShadow = true;
                const rim = new THREE.Mesh(rimGeo, rimMat); rim.rotation.z = Math.PI / 2;
                pivot.add(tire, rim); car.add(pivot);
                wheels.push(tire); if (pos.isFront) frontWheels.push(pivot);
            });
            car.position.set(3, 0, 0); scene.add(car);

            const trafficColors = [0x0000ff, 0x2ed573, 0xffff00, 0xffffff, 0x8e44ad, 0xffa502];
            function spawnTraffic(isOncoming) {
                const isTruck = Math.random() > 0.7;
                const tCar = new THREE.Group();
                const tBodyMat = new THREE.MeshStandardMaterial({ color: trafficColors[Math.floor(Math.random() * trafficColors.length)], metalness: 0.4, roughness: 0.6 });
                if(isTruck) {
                    const cab = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), tBodyMat); cab.position.set(0, 1, -2); cab.castShadow = true;
                    const trailer = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.5, 6), new THREE.MeshStandardMaterial({color: 0xddddee})); trailer.position.set(0, 1.5, 2); trailer.castShadow = true;
                    tCar.add(cab, trailer);
                } else {
                    const tBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 4), tBodyMat); tBody.position.y = 0.5; tBody.castShadow = true;
                    const tCabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.7, 2), darkMat); tCabin.position.set(0, 1.1, 0.2); tCabin.castShadow = true;
                    tCar.add(tBody, tCabin);
                }
                if (isOncoming) tCar.rotation.y = Math.PI;
                tCar.position.set(isOncoming ? -3 : 3, 0, -100 - Math.random() * 100);
                scene.add(tCar);
                traffic.push({ mesh: tCar, isOncoming: isOncoming, speed: isOncoming ? 25 + Math.random() * 15 : 10 + Math.random() * 10 });
            }
            for(let i=0; i<4; i++) { spawnTraffic(true); spawnTraffic(false); }

            const particleGeo = new THREE.BufferGeometry();
            posArray = new Float32Array(particleCount * 3);
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.5, transparent: true, opacity: 1 });
            particles = new THREE.Points(particleGeo, particleMat);
            particles.visible = false; scene.add(particles);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            document.getElementById('loading').style.display = 'none';
            gameState = 'playing';
            resetGame();
            animate();
        }

        // --- ЛОГИКА ---
        function resetGame() {
            speed = 0; score = 0; updateUI();
            if(car) { car.position.set(3, 0, 0); car.rotation.set(0, 0, 0); }
            targetSteer = 0; currentSteer = 0; wheelEl.style.transform = `rotate(0rad)`;
            if(particles) particles.visible = false;
            traffic.forEach(t => { t.mesh.position.z = -100 - Math.random() * 100; t.mesh.position.x = t.isOncoming ? -3 : 3; });
            
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('steering-container').style.display = 'flex';
            gameState = 'playing';
            startEngine();
        }

        function updateUI() {
            document.getElementById('score').innerText = "Счёт: " + Math.floor(score);
            document.getElementById('speed-val').innerText = Math.floor(speed * 3.6);
        }

        function triggerExplosion(x, y, z) {
            particles.position.set(x, y, z); particles.visible = true; particles.material.opacity = 1;
            particleVelocities = [];
            for(let i=0; i<particleCount; i++) {
                posArray[i*3] = (Math.random()-0.5) * 2;
                posArray[i*3+1] = (Math.random()-0.5) * 2;
                posArray[i*3+2] = (Math.random()-0.5) * 2;
                particleVelocities.push({ x: (Math.random()-0.5)*20, y: (Math.random())*20, z: (Math.random()-0.5)*20 });
            }
            particles.geometry.attributes.position.needsUpdate = true;
        }

        function crash() {
            gameState = 'gameover';
            playCrash(); stopEngin
